[project]
name = "feishu-claude-code"
version = "0.1.0"
description = "Bridge Claude Code CLI with Feishu/Lark via WebSocket"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "lark-oapi>=1.3.0",
    "python-dotenv>=1.0.0",
    "APScheduler>=3.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
